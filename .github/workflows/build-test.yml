name: Build and test

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The build only needs a valid connection string to run Prisma generate.
      # Runtime database access is configured separately in the deployment environment.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/csui24
      NEXT_PUBLIC_BASE_URL: https://cosmic.csui.dev
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
